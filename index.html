<style>

html,body{height:100%;margin:0;padding:0;overflow:hidden;position:fixed;width:100%}
body{font-family:'Tajawal',sans-serif;background:radial-gradient(circle at top,var(--bg-grad-1) 0%,rgba(5,6,10,.95) 50%,var(--bg-grad-2) 100%);color:var(--text-main);display:flex;flex-direction:column;position:relative;-webkit-tap-highlight-color:transparent}

.sys{text-align:center;color:var(--text-muted);font-size:12px;margin:10px auto;background:rgba(255,255,255,.03);padding:4px 10px;border-radius:999px}
#inputArea{display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,.7));border-top:1px solid rgba(255,255,255,.04);position:relative;z-index:10}

#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1001;display:none;backdrop-filter:blur(4px)}
#loginScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at top,#181a28 0%,rgba(5,6,10,.96) 50%);display:flex;justify-content:center;align-items:center;z-index:10000}

(function(){

function escapeHtml(s){if(s==null)return '';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isAtBottom(){return messagesDiv.scrollHeight-messagesDiv.scrollTop-messagesDiv.clientHeight<150;}
function scrollToBottom(force){if(!force&&!isAtBottom())return;requestAnimationFrame(()=>{messagesDiv.scrollTop=messagesDiv.scrollHeight;});}
function getYoutubeVideoId(url){if(!url)return null;const m=url.match(/(?:youtube\.com\/shorts\/|youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);return m?m[1]:null;}
function getTweetId(url){if(!url)return null;const m=url.match(/(?:twitter|x)\.com\/\w+\/status\/(\d+)/);return m?m[1]:null;}
function isDirectVideo(url){return /\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(url);}
function formatTime(timestamp){if(!timestamp)return '';const now=Date.now()+serverTimeOffset;const s=Math.floor((now-timestamp)/1000);if(s<5)return 'الآن';if(s<60)return 'ثواني';if(s<120)return 'د1';if(s<3600)return `د${Math.floor(s/60)}`;if(s<86400)return `س${Math.floor(s/3600)}`;if(s<604800)return `ي${Math.floor(s/86400)}`;if(s<2592000)return `أ${Math.floor(s/604800)}`;if(s<31536000)return `ش${Math.floor(s/2592000)}`;return `ع${Math.floor(s/31536000)}`;}
function addNotification(text){const div=document.createElement('div');div.className='sys';div.textContent=text;messagesDiv.appendChild(div);scrollToBottom(true);setTimeout(()=>div.remove(),5000);}
function addMessageToUI(key,data){if(!data||renderedMessages.has(key))return;renderedMessages.add(key);const div=document.createElement('div');div.className='msg';div.id='msg-'+key;const userSpan=document.createElement('span');userSpan.className='user';userSpan.textContent=data.user||'?';const textSpan=document.createElement('span');textSpan.style.flex='1';textSpan.style.wordBreak='break-word';textSpan.textContent=data.text||'';const timeSpan=document.createElement('span');timeSpan.className='time';timeSpan.id='time-'+key;const ts=data.timestamp||(Date.now()+serverTimeOffset);timeSpan.textContent=formatTime(ts);div.appendChild(userSpan);div.appendChild(textSpan);div.appendChild(timeSpan);const siblings=messagesDiv.querySelectorAll('.msg');let inserted=false;for(const s of siblings){if(s.id.startsWith('msg-')&&s.id.slice(4)>key){messagesDiv.insertBefore(div,s);inserted=true;break;}}if(!inserted)messagesDiv.appendChild(div);messageTimestamps.set(key,{timestamp:ts,element:timeSpan});scrollToBottom(false);if(document.visibilityState!=='visible'){unreadCount++;document.title=`(${unreadCount}) شات شوق`;}}
function removeMessage(key){renderedMessages.delete(key);messageTimestamps.delete(key);const el=document.getElementById('msg-'+key);if(el)el.remove();}
function setLoginStatus(msg){loginStatus.textContent=msg||'';}
async function ensureSignedIn(){if(auth.currentUser){currentUser=auth.currentUser;uid=currentUser.uid;console.log('🔐 جلسة موجودة — uid:',uid);return currentUser;}try{setLoginStatus('جارٍ تهيئة الجلسة...');const cred=await auth.signInAnonymously();currentUser=cred.user;uid=cred.user.uid;console.log('🔐 جلسة جديدة — uid:',uid);setLoginStatus('');return cred.user;}catch(err){setLoginStatus('⚠️ تعذّر إنشاء الجلسة. تحقق من اتصالك ثم أعد المحاولة.');console.error('signInAnonymously error',err);throw err;}}
async function claimOrVerifyUsername(rawName){const name=rawName.trim();if(!name)throw new Error('EMPTY');if(/[.#$\[\]/]/.test(name))throw new Error('CHARS');if(name.length<2)throw new Error('SHORT');const nameRef=db.ref('usernames/'+name);const snap=await nameRef.once('value');if(!snap.exists()){await nameRef.set({uid:uid,createdAt:firebase.database.ServerValue.TIMESTAMP});console.log('✅ تم حجز الاسم:',name);return name;}const owner=snap.val();if(owner&&owner.uid===uid){console.log('✅ الاسم موجود ومملوك لك:',name);return name;}console.warn('❌ الاسم محجوز لـ uid آخر:',owner&&owner.uid);throw new Error('TAKEN');}
async function findUsernameForUid(){const snap=await db.ref('usernames').orderByChild('uid').equalTo(uid).limitToFirst(1).once('value');if(!snap.exists())return null;let found=null;snap.forEach(child=>{found=child.key;});return found;}
function setupPresence(){userRef=db.ref('online/'+uid);onlineRef=db.ref('online');const markOnline=()=>{userRef.set({username:username,lastActive:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});userRef.onDisconnect().remove();};db.ref('.info/connected').on('value',snap=>{const connected=snap.val()===true;isConnected=connected;console.log('🌐 الاتصال:',connected?'متصل':'منقطع');if(connected){markOnline();ensureMessageListeners();}});setInterval(()=>{if(isConnected&&userRef){userRef.update({lastActive:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});}},60000);setInterval(()=>{if(!isConnected)return;const now=Date.now()+serverTimeOffset;onlineRef.once('value',snap=>{snap.forEach(child=>{const val=child.val();if(val&&val.lastActive&&(now-val.lastActive>300000)){child.ref.remove().catch(()=>{});}});}).catch(()=>{});},300000);onlineRef.on('value',snap=>{onlineCountEl.textContent=snap.numChildren();renderUsersList(snap.val()||{});});}
function renderUsersList(users){const now=Date.now()+serverTimeOffset;const frag=document.createDocumentFragment();Object.keys(users).forEach(key=>{const entry=users[key]||{};const displayName=entry.username||key;const last=entry.lastActive||0;const diff=now-last;let cls='status-gray';if(diff<30000)cls='status-green';else if(diff<60000)cls='status-yellow';const div=document.createElement('div');div.className='user-item';const dot=document.createElement('span');dot.className='status-indicator '+cls;const name=document.createElement('span');name.textContent=displayName;div.appendChild(dot);div.appendChild(name);frag.appendChild(div);});usersListEl.replaceChildren(frag);}
function ensureMessageListeners(){if(!messageQuery){console.log('📡 تفعيل مستمع الرسائل (أول مرة)');messageQuery=messagesRef.limitToLast(100);messageQuery.keepSynced(true);messageQuery.on('child_added',snap=>{console.log('📩 child_added:',snap.key,snap.val());addMessageToUI(snap.key,snap.val());});messageQuery.on('child_removed',snap=>{console.warn('🗑️ child_removed:',snap.key);removeMessage(snap.key);});}else{console.log('🔄 إعادة مزامنة الرسائل');messageQuery.once('value',snap=>{if(!snap.exists())return;snap.forEach(child=>addMessageToUI(child.key,child.val()));}).catch(err=>console.warn('resync فشل:',err));}}
function setupTyping(){typingRef=db.ref('typing');typingRef.child(uid).onDisconnect().remove();let localTyping=false;const setTyping=(on)=>{if(on===localTyping)return;localTyping=on;if(on){typingRef.child(uid).set({user:username,time:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{});}else{typingRef.child(uid).remove().catch(()=>{});}};const onActivity=()=>{const hasText=messageInput.value.length>0;setTyping(hasText);if(typingTimeout)clearTimeout(typingTimeout);if(hasText)typingTimeout=setTimeout(()=>setTyping(false),2500);};messageInput.addEventListener('input',onActivity);messageInput.addEventListener('keydown',onActivity);document.getElementById('inputArea').addEventListener('submit',()=>{setTyping(false);if(typingTimeout)clearTimeout(typingTimeout);});typingRef.on('value',snap=>{typingUsers.clear();const now=Date.now()+serverTimeOffset;snap.forEach(child=>{if(child.key===uid)return;const v=child.val();if(v&&v.time&&(now-v.time)<5000){typingUsers.set(child.key,{user:v.user||'?',time:v.time});}});updateTypingDisplay();});setInterval(()=>{const now=Date.now()+serverTimeOffset;let changed=false;for(const[k,v]of typingUsers){if(now-v.time>5000){typingUsers.delete(k);changed=true;}}if(changed)updateTypingDisplay();},2500);}
function updateTypingDisplay(){const names=Array.from(typingUsers.values()).map(v=>v.user);if(names.length===0){typingWrapper.style.display='none';return;}typingWrapper.style.display='flex';let msg;if(names.length===1)msg=`${names[0]} يكتب...`;else if(names.length===2)msg=`${names[0]} و ${names[1]} يكتبان...`;else msg='عدة أشخاص يكتبون...';typingIndicator.textContent=msg;}
async function fetchTwitterVideos(tweetId){const videos=[];try{const r=await fetch(`https://api.fxtwitter.com/status/${tweetId}`);if(r.ok){const d=await r.json();(d.tweet?.media?.videos||[]).forEach(v=>{if(v.url)videos.push({url:v.url,type:'video/mp4'});});}}catch(e){}if(videos.length)return videos;try{const r=await fetch(`https://api.vxtwitter.com/status/${tweetId}`);if(r.ok){const d=await r.json();(d.media_extended||[]).forEach(m=>{if((m.type==='video'||m.type==='gif')&&m.url)videos.push({url:m.url,type:'video/mp4'});});}}catch(e){}return videos;}
function embedTwitterNative(container,tweetId){container.replaceChildren();container.style.background='#15202b';const iframe=document.createElement('iframe');iframe.src=`https://platform.twitter.com/embed/Tweet.html?id=${tweetId}&theme=dark&lang=ar`;iframe.style.cssText='width:100%;height:100%;min-height:320px;border:none';iframe.setAttribute('allowfullscreen','true');container.appendChild(iframe);}
function disposePlayer(){if(videoPlayerInstance){try{videoPlayerInstance.dispose();}catch(e){}videoPlayerInstance=null;}}
function createVideoPlayer(container,source,type,isYoutube){container.replaceChildren();const isHLS=(type==='application/x-mpegURL'||source.includes('.m3u8')||source.includes('.m3u'));const test=document.createElement('video');const nativeHLS=!!(test.canPlayType('application/vnd.apple.mpegurl')||test.canPlayType('application/x-mpegURL'));if(isHLS&&!nativeHLS&&window.Hls&&Hls.isSupported()){const vid=document.createElement('video');vid.controls=true;vid.autoplay=true;vid.muted=true;vid.playsInline=true;vid.style.cssText='width:100%;height:100%';container.appendChild(vid);try{const hls=new Hls();hls.loadSource(source);hls.attachMedia(vid);hls.on(Hls.Events.ERROR,(_e,data)=>{if(data.fatal)container.innerHTML='<p style="padding:12px;color:#ff6b6b;">⚠️ فشل تشغيل البث</p>';});videoPlayerInstance={dispose:()=>{try{hls.destroy();}catch(e){}vid.remove();}};}catch(e){container.innerHTML='<p style="color:#ff6b6b;">خطأ في المشغل</p>';}return;}const videoEl=document.createElement('video-js');videoEl.className='vjs-netflix-theme';container.appendChild(videoEl);try{const player=videojs(videoEl,{autoplay:true,muted:true,controls:true,aspectRatio:'16:9',playsinline:true,techOrder:isYoutube?['youtube']:['html5'],sources:[{type,src:source}]});videoPlayerInstance=player;player.on('error',()=>{container.innerHTML='<p style="padding:12px;color:#ff6b6b;">⚠️ فشل تشغيل الفيديو</p>';});}catch(e){container.innerHTML='<p style="color:#ff6b6b;">خطأ في المشغل</p>';}}
function makeDraggable(element,handle){let sx,sy,sl,st,dragging=false;const pos=e=>e.touches?e.touches[0]:e;function start(e){if(e.target.classList&&e.target.classList.contains('close-pinned-video'))return;e.preventDefault();dragging=true;const p=pos(e);sx=p.clientX;sy=p.clientY;sl=element.offsetLeft;st=element.offsetTop;document.addEventListener('mousemove',move);document.addEventListener('touchmove',move,{passive:false});document.addEventListener('mouseup',end);document.addEventListener('touchend',end);}function move(e){if(!dragging)return;if(window.innerWidth<=600)return;e.preventDefault();const p=pos(e);let nl=sl+(p.clientX-sx);let nt=st+(p.clientY-sy);nl=Math.min(window.innerWidth-element.offsetWidth,Math.max(0,nl));nt=Math.min(window.innerHeight-element.offsetHeight,Math.max(0,nt));element.style.left=nl+'px';element.style.top=nt+'px';element.style.right='auto';element.style.bottom='auto';}function end(){dragging=false;document.removeEventListener('mousemove',move);document.removeEventListener('touchmove',move);document.removeEventListener('mouseup',end);document.removeEventListener('touchend',end);}handle.addEventListener('mousedown',start);handle.addEventListener('touchstart',start,{passive:false});}
function makeResizable(element,handle){let sw,sh,sx,sy;const pos=e=>e.touches?e.touches[0]:e;function start(e){e.preventDefault();sw=element.offsetWidth;sh=element.offsetHeight;const p=pos(e);sx=p.clientX;sy=p.clientY;document.addEventListener('mousemove',move);document.addEventListener('touchmove',move,{passive:false});document.addEventListener('mouseup',end);document.addEventListener('touchend',end);}function move(e){e.preventDefault();const p=pos(e);const nw=sw+(p.clientX-sx);const nh=sh+(p.clientY-sy);if(nw>280)element.style.width=nw+'px';if(nh>200)element.style.height=nh+'px';}function end(){document.removeEventListener('mousemove',move);document.removeEventListener('touchmove',move);document.removeEventListener('mouseup',end);document.removeEventListener('touchend',end);}handle.addEventListener('mousedown',start);handle.addEventListener('touchstart',start,{passive:false});}
function closeAllModals(){$('usersBox').style.display='none';$('setVideoModal').style.display='none';overlay.style.display='none';}
async function startChat(){if(started)return;started=true;console.log('🚀 startChat بدأ — uid:',uid,'| username:',username,'| auth:',!!auth.currentUser);loginScreen.style.display='none';chatContainer.style.display='flex';try{const s=await db.ref('.info/serverTimeOffset').once('value');serverTimeOffset=s.val()||0;}catch(e){}db.ref('.info/serverTimeOffset').on('value',snap=>{serverTimeOffset=snap.val()||0;});messagesRef=db.ref('messages');pinnedVideoRef=db.ref('pinned_video');setupPresence();ensureMessageListeners();setupTyping();document.getElementById('inputArea').onsubmit=(e)=>{e.preventDefault();const text=messageInput.value.trim();if(!text)return;if(!currentUser||!uid){addNotification('⚠️ الجلسة غير جاهزة');console.error('❌ لا يوجد uid');return;}const now=Date.now();if(now-lastSendAt<MIN_SEND_INTERVAL)return;lastSendAt=now;sendBtn.disabled=true;setTimeout(()=>{sendBtn.disabled=false;},MIN_SEND_INTERVAL);console.log('📤 محاولة إرسال:',text.slice(0,30));messagesRef.push({uid:uid,user:username,text:text,timestamp:firebase.database.ServerValue.TIMESTAMP,clientTs:now}).then(()=>{console.log('✅ رسالة أُرسلت بنجاح:',text.slice(0,30));}).catch(err=>{console.error('❌ فشل إرسال الرسالة:',err);addNotification('⚠️ تعذّر الإرسال: '+(err&&err.message?err.message:'خطأ غير معروف'));});messageInput.value='';scrollToBottom(true);};onlineListBtn.onclick=()=>{$('usersBox').style.display='block';overlay.style.display='block';};setVideoBtn.onclick=()=>{$('setVideoModal').style.display='block';overlay.style.display='block';};overlay.onclick=closeAllModals;submitVideoUrlBtn.onclick=async()=>{const url=videoUrlInput.value.trim();if(!url)return;const yt=getYoutubeVideoId(url);const tw=getTweetId(url);try{if(yt)await pinnedVideoRef.set({type:'youtube',id:yt,setBy:username,setByUid:uid});else if(tw)await pinnedVideoRef.set({type:'twitter',id:tw,setBy:username,setByUid:uid});else if(url.includes('.m3u8')||url.includes('.m3u'))await pinnedVideoRef.set({type:'m3u',url,setBy:username,setByUid:uid});else if(isDirectVideo(url))await pinnedVideoRef.set({type:'direct',url,setBy:username,setByUid:uid});else{alert('رابط غير مدعوم');return;}videoUrlInput.value='';closeAllModals();}catch(e){alert('تعذر تثبيت الفيديو');}};pinnedVideoRef.on('value',async(snap)=>{disposePlayer();pinnedVideoPlayer.replaceChildren();currentVideosList=[];const data=snap.val();if(!data){pinnedVideoPlayer.style.display='none';return;}pinnedVideoPlayer.style.display='flex';const header=document.createElement('div');header.className='video-header';const title=document.createElement('span');title.textContent='بث — '+(data.setBy||'');const closeBtn=document.createElement('button');closeBtn.className='close-pinned-video';closeBtn.textContent='✖';closeBtn.onclick=(e)=>{e.stopPropagation();pinnedVideoRef.remove().catch(()=>{});};header.appendChild(title);header.appendChild(closeBtn);const body=document.createElement('div');body.className='video-body';const resize=document.createElement('div');resize.className='resize-handle';pinnedVideoPlayer.appendChild(header);pinnedVideoPlayer.appendChild(body);pinnedVideoPlayer.appendChild(resize);makeDraggable(pinnedVideoPlayer,header);makeResizable(pinnedVideoPlayer,resize);if(data.type==='youtube')createVideoPlayer(body,`https://www.youtube.com/watch?v=${data.id}`,'video/youtube',true);else if(data.type==='m3u')createVideoPlayer(body,data.url,'application/x-mpegURL',false);else if(data.type==='direct')createVideoPlayer(body,data.url,'video/mp4',false);else if(data.type==='twitter'){embedTwitterNative(body,data.id);const vids=await fetchTwitterVideos(data.id);if(vids.length){currentVideosList=vids;currentVideoIndex=0;const v=document.createElement('video');v.controls=true;v.autoplay=true;v.muted=true;v.playsInline=true;v.style.cssText='width:100%;height:100%';v.src=vids[0].url;body.replaceChildren(v);videoPlayerInstance={dispose:()=>{v.src='';v.remove();}};if(vids.length>1){const bar=document.createElement('div');bar.className='video-selector-bar';vids.forEach((it,i)=>{const b=document.createElement('button');b.className='video-selector-btn'+(i===0?' active':'');b.textContent='مقطع '+(i+1);b.onclick=()=>{if(i===currentVideoIndex)return;currentVideoIndex=i;v.src=it.url;v.play().catch(()=>{});bar.querySelectorAll('.video-selector-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');};bar.appendChild(b);});body.appendChild(bar);}v.onerror=()=>embedTwitterNative(body,data.id);}}addNotification((data.setBy||'أحدهم')+' قام بتشغيل فيديو');});setInterval(()=>{messageTimestamps.forEach(({timestamp,element})=>{const t=formatTime(timestamp);if(element.textContent!==t)element.textContent=t;});},30000);const resync=()=>{if(!messageQuery)return;messageQuery.once('value',snap=>{if(!snap.exists())return;snap.forEach(c=>addMessageToUI(c.key,c.val()));}).catch(()=>{});document.title='شات شوق';unreadCount=0;};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!isConnected){try{firebase.database().goOnline();}catch(e){}}resync();}});window.addEventListener('focus',resync);window.addEventListener('pageshow',(e)=>{if(e.persisted)resync();});window.addEventListener('online',()=>{try{firebase.database().goOnline();}catch(e){}resync();});}
async function attemptLogin(){const raw=usernameInput.value.trim();if(!raw)return alert('الرجاء إدخال اسم');if(/[.#$\[\]/]/.test(raw))return alert('لا يُسمح بأحرف خاصة: . # $ [ ] /');if(raw.length<2)return alert('الاسم قصير جداً');loginBtn.disabled=true;setLoginStatus('جارٍ التحقق...');try{await ensureSignedIn();const name=await claimOrVerifyUsername(raw);username=name;try{localStorage.setItem('chatshoq_user',name);}catch(e){}await startChat();}catch(err){if(err&&err.message==='TAKEN'){setLoginStatus('⚠️ هذا الاسم محجوز لمستخدم آخر. اختر اسمًا مختلفًا.');}else if(err&&err.message==='CHARS'){setLoginStatus('⚠️ الاسم يحتوي أحرفًا غير مسموحة.');}else if(err&&err.message==='SHORT'){setLoginStatus('⚠️ الاسم قصير جداً.');}else if(err&&err.message==='EMPTY'){setLoginStatus('⚠️ الرجاء إدخال اسم.');}else{setLoginStatus('⚠️ تعذّر الدخول. حاول مرة أخرى.');console.error(err);}loginBtn.disabled=false;}}
(async function boot(){let savedName=null;try{savedName=localStorage.getItem('chatshoq_user');}catch(e){}if(savedName)usernameInput.value=savedName;const existing=auth.currentUser;if(existing){currentUser=existing;uid=existing.uid;try{const owned=await findUsernameForUid();if(owned){username=owned;usernameInput.value=owned;startChat();return;}}catch(e){console.warn('restore username failed',e);}setLoginStatus('لديك جلسة سابقة. أدخل اسمك للمتابعة.');}})();
loginBtn.onclick=attemptLogin;
usernameInput.addEventListener('keypress',e=>{if(e.key==='Enter')attemptLogin();});
})();
